<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tichá cesta · navigace hřbitovem</title>
  <meta name="description" content="Vyhledání hrobu podle jména, data úmrtí nebo čísla hrobu a navigace přímo k místu.">
  <meta name="theme-color" content="#F3EFE6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=40">
  <script>
    /* denní/noční režim a vzhled mapy nastavit ještě před vykreslením stránky (bez probliknutí) */
    (function () {
      try {
        var d = document.documentElement, g = function (k) { var v = localStorage.getItem('tc.' + k); return v ? JSON.parse(v) : null; };
        d.dataset.theme = g('theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        d.dataset.mapstyle = g('mapstyle') || 'natural';
        var lite = g('lite');
        if (lite == null) lite = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3;
        if (lite) d.classList.add('lite');
      } catch (e) { document.documentElement.dataset.theme = 'light'; document.documentElement.dataset.mapstyle = 'natural'; }
    })();
  </script>
</head>
<body>
<div class="app" id="app">
  <div class="map" id="map"></div>

  <header class="topbar">
    <a class="brand" href="#" data-act="home" aria-label="Tichá cesta – úvod">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#2D4A3D"/>
        <path d="M11 31V19a9 9 0 0 1 18 0v12" fill="none" stroke="#F3EFE6" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 31c0-4-4.2-4.6-4.2-8.2S20 18.6 20 16" fill="none" stroke="#C98A4E" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 3.6"/>
        <circle cx="20" cy="12.6" r="1.9" fill="#C98A4E"/>
      </svg>
      <span class="brand-text"><b>Tichá cesta</b><small id="cemName">Hřbitov</small></span>
    </a>
    <nav class="topnav" id="topnav" aria-label="Hlavní nabídka">
      <button data-act="view" data-v="pohrby">Pohřby <span class="nav-badge" id="funBadge"></span></button>
      <button data-act="view" data-v="sprava">Správa<span class="lbl-long"> hřbitova</span></button>
      <button data-act="view" data-v="panorama">Panorama 360°</button>
      <button class="account" data-act="view" data-v="ucet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <span id="accLabel">Můj účet</span>
      </button>
    </nav>
    <button class="menu-btn" data-act="menu" aria-label="Nabídka" aria-controls="topnav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </header>

  <aside class="panel" id="panel" aria-label="Vyhledávání a informace">
    <div class="sheet-handle" id="handle" role="button" aria-label="Rozbalit panel"><span></span></div>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="Jméno, datum úmrtí nebo číslo hrobu" aria-label="Hledat hrob">
      <button type="button" class="icon-btn" id="clearBtn" data-act="clear" aria-label="Vymazat" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button type="button" class="icon-btn" id="filterBtn" data-act="filters" aria-label="Upřesnit hledání" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </form>
    <div class="filters" id="filters" hidden>
      <label>Oddělení <select id="fSec"><option value="">Všechna</option></select></label>
      <label>Úmrtí od <input id="fFrom" type="number" inputmode="numeric" min="1900" max="2100" placeholder="rok"></label>
      <label>do <input id="fTo" type="number" inputmode="numeric" min="1900" max="2100" placeholder="rok"></label>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <div class="map-controls" id="controls">
    <button data-act="zoom-in" aria-label="Přiblížit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-act="zoom-out" aria-label="Oddálit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button data-act="fit" aria-label="Celý hřbitov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button data-act="locate" id="locateBtn" aria-label="Moje poloha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></svg></button>
    <button data-act="layers" id="layersBtn" aria-label="Vrstvy a vzhled mapy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 14 9 5 9-5"/></svg></button>
    <button class="rot-btn" data-act="rot-l" aria-label="Otočit mapu doleva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="rot-btn" data-act="rot-r" aria-label="Otočit mapu doprava"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
    <button class="theme-btn" data-act="theme" id="themeBtn" aria-label="Přepnout noční režim" aria-pressed="false">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
    </button>
  </div>
  <div class="layers-pop" id="layersPop" hidden>
    <h5>Vzhled mapy</h5>
    <div class="style-row" role="group" aria-label="Barevný vzhled mapy">
      <button class="style-opt" data-act="mapstyle" data-style="natural"><i class="sw sw-natural"></i>Přírodní</button>
      <button class="style-opt" data-act="mapstyle" data-style="clean"><i class="sw sw-clean"></i>Čistá</button>
      <button class="style-opt" data-act="mapstyle" data-style="sepia"><i class="sw sw-sepia"></i>Pergamen</button>
    </div>
    <label class="opt-row">Noční režim <span class="switch"><input type="checkbox" id="themeSw"><i></i></span></label>
    <label class="opt-row">Úsporné vykreslení<small>Pro slabší zařízení: bez stínů a animací</small> <span class="switch"><input type="checkbox" id="liteSw"><i></i></span></label>
    <h5>Zobrazit na mapě</h5>
    <label><i style="background:#3F7F9A"></i>Voda <input type="checkbox" data-layer="water" checked></label>
    <label><i style="background:#7A7F76"></i>Odpadkové koše <input type="checkbox" data-layer="bin" checked></label>
    <label><i style="background:#9A7F57"></i>Lavičky <input type="checkbox" data-layer="bench" checked></label>
    <label><i style="background:#2D4A3D"></i>Kříže a pomníky <input type="checkbox" data-layer="service" checked></label>
    <label><i style="background:#B06F35"></i>Panorama 360° <input type="checkbox" data-layer="pano" checked></label>
    <label><i style="background:#7F9973"></i>Stromy <input type="checkbox" data-layer="trees" checked></label>
  </div>
  <div class="map-foot">
    <div class="legend" aria-label="Legenda">
      <span><i></i>Hrob</span><span><i class="lg-tomb"></i>Hrobka</span><span><i class="lg-urn"></i>Urnové místo</span>
      <span><i class="lg-free"></i>Volné místo</span><span><i class="lg-route"></i>Trasa</span>
    </div>
    <button class="compass" id="compass" data-act="north" title="Otočit na sever" aria-label="Otočit mapu na sever"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" class="cp-ring"/><path d="M16 4 L20.5 16 L16 14.2 L11.5 16Z" class="cp-n"/><path d="M16 28 L11.5 16 L16 17.8 L20.5 16Z" class="cp-s"/><text x="16" y="31.5">S</text></svg></button>
    <div class="scalebar" id="scale"><i></i><span></span></div>
  </div>

  <div class="route-chip" id="routeChip" hidden></div>
  <div class="tip" id="tip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-act="close" aria-label="Zavřít">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="data/vitkovice.js?v=40"></script>
<script src="js/data.js?v=40"></script>
<script src="js/map.js?v=40"></script>
<script src="js/app.js?v=40"></script>
</body>
</html>
